spring.application.name=support-erp

# 8083 keeps the support service off hr-erp (8080), library-erp (8081) and alumni-erp (8082).
server.port=${SERVER_PORT:8083}

# ---- Datasource (PostgreSQL) ----
# Defaults target the local compose Postgres, which publishes on 5435 so it does not collide
# with the other modules'. Override via env for the VPS deployment.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/supportdb}
spring.datasource.username=${DB_USERNAME:myuser}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# Let Flyway own the schema; Hibernate only validates against it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- Flyway ----
# db/undo holds the hand-run rollback scripts and is deliberately not on the migration path.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Docker-compose support is disabled so the explicit datasource above is used.
spring.docker.compose.enabled=false

# ---- File storage (VPS filesystem: ticket screenshots) ----
app.storage.base-path=${STORAGE_BASE_PATH:./support-storage}
# One of three limits on the same number, and the least binding of them: raising it alone changes
# nothing, because spring.servlet.multipart.max-file-size below rejects the part first and
# ck_ticket_attachments_size in V1 rejects the row last. To actually allow larger screenshots,
# move all three — and the migration means a new V-script, not an edit to V1.
app.storage.max-size-bytes=${STORAGE_MAX_SIZE:5242880}

# ---- Internationalization ----
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# ---- CORS allowed origins (ERP shell) ----
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,https://erp.aztu.edu.az}

# ---- SSO (central auth microservice) ----
# When sso.introspection-url is set, bearer tokens are validated remotely.
# Otherwise a local dev decoder is used (base64 "userId:role1,role2").
app.sso.introspection-url=${SSO_INTROSPECTION_URL:}
app.sso.dev-mode=${SSO_DEV_MODE:true}

# ---- Support business rules (mirrored by the frontend as UX hints only) ----
# An irrelevant ticket this many times over earns a warning...
app.support.violation.warn-threshold=${VIOLATION_WARN_THRESHOLD:1}
# ...and this many blocks the account. Never hardcoded: raise either without touching code.
app.support.violation.block-threshold=${VIOLATION_BLOCK_THRESHOLD:2}
# A reporter may open this many tickets per window (sliding, per service instance).
app.support.rate-limit.max-tickets=${TICKET_RATE_LIMIT_MAX:5}
app.support.rate-limit.window-minutes=${TICKET_RATE_LIMIT_WINDOW_MINUTES:10}
# Screenshots per ticket.
app.support.attachments.max-per-ticket=${TICKET_MAX_ATTACHMENTS:3}

# ---- Auth service (block/unblock delivery + internal callbacks) ----
# Base URL of the central auth microservice. Left empty locally: block decisions are still
# recorded and queued in auth_sync_events, they simply are not delivered anywhere yet.
app.auth.base-url=${AUTH_BASE_URL:}
# Shared secret sent as X-Service-Token on outgoing internal calls, and required on the
# /api/support/internal/** endpoints the auth service calls back into. MUST be overridden.
app.auth.service-token=${SERVICE_TOKEN:change-me-support-service-token}
app.auth.max-attempts=${AUTH_SYNC_MAX_ATTEMPTS:5}
app.auth.poll-interval-ms=${AUTH_SYNC_POLL_INTERVAL_MS:60000}

# ---- Multipart (up to 3 screenshots of 5 MB each) ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=16MB

# ---- Jackson (Jackson 3 / tools.jackson under Spring Boot 4) ----
spring.jackson.default-property-inclusion=non_null
